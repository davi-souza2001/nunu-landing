<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nunu — Reel da conversa</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { margin: 0; background: var(--sand); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--sand); }
  .deco { position: absolute; inset: 0; }
  #top { position: absolute; top: 120px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #top img { width: 120px; }
  #top p { font-size: 34px; font-weight: 600; color: var(--sage-dark); letter-spacing: 0.02em; }
  #phoneWrap { position: absolute; left: 50%; top: 360px; transform-origin: top center; }
  .msg { overflow: hidden; flex: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 4px; margin: 0 -4px; }
  .chat-body { gap: 0 !important; }
  .msg > * { margin-top: 18px; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end .h1 { font-family: var(--serif); font-weight: 500; font-size: 128px; line-height: 1.02; letter-spacing: -0.01em; color: var(--brown); }
  #end .h1 em { font-style: italic; font-weight: 400; }
  #end .sub { font-size: 44px; line-height: 1.4; color: var(--ink); margin-top: 56px; }
  #end .pill { margin-top: 64px; padding: 22px 44px; border-radius: 999px; background: var(--sage-dark); color: var(--white); font-size: 38px; font-weight: 700; }
  #end img { width: 230px; margin-top: 120px; }
</style>
</head>
<body>
<div id="stage">
  <svg class="deco" viewBox="0 0 1080 1920"></svg>
  <div id="top"><img src="../assets/simbolo.png" alt=""><p>Uma conversa com a Nunu</p></div>
  <div id="phoneWrap"></div>
  <div id="end">
    <h1 class="h1">Sua rotina<br>mais <em>leve</em>.</h1>
    <p class="sub">Sua assistente de nutrição<br>no WhatsApp.</p>
    <div class="pill">30 mensagens grátis · link na bio</div>
    <img src="../assets/logo-completo.png" alt="">
  </div>
</div>
<script src="brand.js"></script>
<script>
  document.querySelector('.deco').innerHTML =
    `<path d="M0 0 H420 C370 140 280 200 150 230 C70 248 25 300 0 380 Z" fill="#dde5d3"/>` +
    `<path d="M1080 1920 H640 C700 1790 800 1720 930 1680 C1010 1655 1060 1600 1080 1530 Z" fill="#ead9c6" opacity=".9"/>` +
    branch({ x: -20, y: 420, rot: -60, scale: 1.1 }) + branch({ x: 1110, y: 260, rot: -155, scale: 1, leaves: 6 }) +
    branch({ x: -40, y: 1900, rot: -35, scale: 1.05 }) + branch({ x: 1120, y: 1500, rot: -125, scale: .85, leaves: 5 });

  const wrap = document.getElementById('phoneWrap');
  const msg = (id, html) => `<div class="msg" id="${id}">${html}</div>`;
  wrap.innerHTML = phoneHTML(
    msg('w1', MSG.audio) + msg('wt1', MSG.typing) + msg('w2', MSG.reply1) +
    msg('w3', MSG.photo) + msg('wt2', MSG.typing) + msg('w4', MSG.reply2),
  );
  const SCALE = 1.22;

  // Linha do tempo (segundos). Cada mensagem entra crescendo de altura — a
  // conversa "rola" suave, como no WhatsApp, em vez de pular.
  const TL = [
    { id: 'w1', in: 1.3 },
    { id: 'wt1', in: 2.3, out: 4.1 },
    { id: 'w2', in: 4.1 },
    { id: 'w3', in: 7.5 },
    { id: 'wt2', in: 8.3, out: 10.1 },
    { id: 'w4', in: 10.1 },
  ];
  const END_AT = 13.8;
  window.DURATION = 18;

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  // Altura natural de cada mensagem, medida uma vez.
  const H = {};
  for (const m of TL) H[m.id] = document.getElementById(m.id).offsetHeight;

  window.render = (t) => {
    // Abertura: título e celular sobem.
    const intro = easeOut(clamp(t / 1.0));
    const top = document.getElementById('top');
    top.style.opacity = intro;
    top.style.transform = `translateY(${(1 - intro) * 30}px)`;

    const outP = easeOut(clamp((t - END_AT) / 0.8));
    const phoneIn = easeOut(clamp((t - 0.2) / 1.0));
    wrap.style.opacity = phoneIn * (1 - outP);
    wrap.style.transform = `translateX(-50%) translateY(${(1 - phoneIn) * 120 + outP * 80}px) scale(${SCALE * (1 - outP * 0.06)})`;
    top.style.opacity = intro * (1 - outP);

    for (const m of TL) {
      const el = document.getElementById(m.id);
      const child = el.firstElementChild;
      const pin = clamp((t - m.in) / 0.38);
      const pout = m.out ? clamp((t - m.out) / 0.2) : 0;
      const vis = easeOut(pin) * (1 - pout);
      el.style.height = `${H[m.id] * vis}px`;
      child.style.opacity = clamp(pin * 1.6) * (1 - pout);
      child.style.transform = `scale(${0.82 + 0.18 * easeBack(pin)}) translateY(${(1 - easeOut(pin)) * 16}px)`;
      if (m.id.startsWith('wt')) {
        child.querySelectorAll('i').forEach((d, i) => {
          const y = Math.max(0, Math.sin(t * Math.PI * 2 * 1.5 - i * 0.7)) * 9;
          d.style.transform = `translateY(${-y}px)`;
          d.style.opacity = 0.55 + y / 20;
        });
      }
    }

    const endP = easeOut(clamp((t - END_AT - 0.4) / 0.9));
    const end = document.getElementById('end');
    end.style.opacity = endP;
    end.style.transform = `translateY(${(1 - endP) * 40}px)`;
  };
  window.render(0);
</script>
</body>
</html>
