name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions.
  workflow_dispatch:

# O token só precisa ler o repo e publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Não cancela um deploy em andamento; enfileira o próximo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build estático
        # `base_path` vem do passo acima: vazio em domínio próprio,
        # `/nome-do-repo` quando o site mora num subcaminho.
        # `CHECKOUT_URL` (Payment Link do Stripe) e `WHATSAPP_NUMBER` (número
        # da Nunu, só dígitos com DDI) são variáveis do repositório: Settings →
        # Secrets and variables → Actions → Variables.
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
